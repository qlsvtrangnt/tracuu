<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Tra cứu Tích hợp</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* ========================================== */
        /* GIAO DIỆN MÁY TÍNH (MẶC ĐỊNH NẰM NGANG)    */
        /* ========================================== */
        .search-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .search-title {
            color: #007bff;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4em;
        }

        .search-input-group {
            display: flex;
            flex-direction: row;
            /* ÉP BUỘC nằm ngang trên PC */
            align-items: stretch;
            /* Chiều cao ô nhập và nút bằng nhau */
            gap: 15px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            /* Ô nhập tự giãn chiếm hết phần trống */
            padding: 12px 15px;
            border: 2px solid #ced4da;
            border-radius: 5px;
            font-size: 1em;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #007bff;
        }

        .search-btn {
            width: auto;
            /* Chiều rộng ôm vừa đủ chữ trên PC */
            padding: 12px 30px;
            background: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            white-space: nowrap;
            /* Cấm rớt dòng chữ bên trong nút */
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background: #0056b3;
        }

        /* CSS CỦA BẢNG ĐIỂM */
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
            position: sticky;
            top: 0;
        }

        td:nth-child(2) {
            text-align: left;
        }

        .btn-download {
            background: #28a745;
            margin-bottom: 10px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ========================================== */
        /* RESPONSIVE CHO ĐIỆN THOẠI (XẾP DỌC)        */
        /* ========================================== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                background: #fff;
            }

            .container {
                padding: 15px;
                box-shadow: none;
                border-radius: 0;
            }

            h2 {
                font-size: 1.2rem;
            }

            .search-container {
                margin: 10px auto;
                padding: 15px;
                border: 1px solid #eaeaea;
                box-shadow: none;
            }

            .search-title {
                font-size: 1.2rem;
                text-align: center;
                margin-bottom: 15px;
            }

            /* Bẻ khóa nằm ngang, ÉP BUỘC xếp dọc trên Mobile */
            .search-input-group {
                flex-direction: column;
                gap: 12px;
            }

            /* Cả ô nhập và nút bấm bung rộng 100% */
            .search-input,
            .search-btn {
                width: 100%;
                padding: 14px;
                font-size: 16px;
                /* Chống tự động zoom trên iOS */
            }

            th,
            td {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>HỆ THỐNG TRA CỨU THÔNG TIN</h2>
        <div class="search-container">
            <h3 class="search-title">🔍 Tra cứu điểm sinh viên</h3>

            <div id="inputArea" class="search-input-group">
                <input type="text" id="textInput" class="search-input" placeholder="Nhập Mã sinh viên (VD: 2026115)">

                <button class="search-btn" onclick="executeSearch()">
                    Tra cứu ngay
                </button>
            </div>

            <div class="tabs" style="display: none;">
                <label><input type="radio" name="mode" value="rag"> 1. Tra cứu - trích xuất văn bản</label>
                <label><input type="radio" name="mode" value="grades" checked>2. Tra cứu điểm</label>
                <label><input type="radio" name="mode" value="tuition"> 3. Tra cứu học phí</label>

                <input type="file" id="fileInput" accept=".xlsx, .xls">
            </div>
        </div>

        <div id="resultArea" style="margin-top: 20px;"></div>

    </div>

    <script>
        // ==========================================
        // MÀNG LỌC BẢO MẬT: CHỐNG CHIA SẺ LINK TRÁI PHÉP
        // MÀNG LỌC BẢO MẬT & PHÂN QUYỀN (ADMIN / STUDENT)
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            // Giao diện Lỗi khi bị chặn
            const showErrorAndBlock = () => {
                document.body.innerHTML = `
				<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#f8fafc; font-family:sans-serif; text-align:center; padding:15px;">
					<div style="background:white; padding:25px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); max-width:500px; border-top: 5px solid #dc3545; width: 100%; box-sizing: border-box;">
						<h2 style="color:#dc3545; margin-bottom:15px; font-size:22px; font-weight: 900;">⛔ TRUY CẬP BỊ TỪ CHỐI</h2>
						<p style="color:#64748b; line-height:1.6; font-size:15px;">Liên kết này không hợp lệ hoặc phiên truy cập đã hết hạn.</p>
						<p style="color:#64748b; line-height:1.6; font-size:15px; margin-top: 10px;">Vui lòng đăng nhập vào <b>Cổng đăng ký học tập</b> của nhà trường và chọn tính năng Tra cứu.</p>
					</div>
				</div>
			`;
            };

            let authId = null;
            let authRole = 'student'; // Mặc định là sinh viên

            if (token) {
                // Lần đầu click chuyển qua từ Cổng Đăng Ký
                try {
                    const decoded = atob(token); // Giải mã Token
                    const parts = decoded.split('|');
                    
                    // Chấp nhận Token 2 phần (MSV|Time) hoặc 3 phần (ID|Time|Role)
                    if (parts.length < 2) throw new Error("Invalid format");

                    const userId = parts[0];
                    const timestampStr = parts[1];
                    const role = parts[2] ? parts[2].toLowerCase() : 'student'; 
                    const timestamp = parseInt(timestampStr, 10);

                    // Kiểm tra hết hạn: Token chỉ sống đúng 60 giây (60000 ms)
                    if (Date.now() - timestamp > 60000) throw new Error("Expired");

                    authId = userId;
                    authRole = role;

                    // Lưu vé và quyền vào bộ nhớ đệm
                    sessionStorage.setItem("secure_id", authId);
                    sessionStorage.setItem("secure_role", authRole);

                    // Tẩy xóa token trên thanh URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (e) {
                    return showErrorAndBlock();
                }
            } else {
                // Trường hợp người dùng F5 tải lại trang
                authId = sessionStorage.getItem("secure_id");
                authRole = sessionStorage.getItem("secure_role") || 'student';
                if (!authId) return showErrorAndBlock();
            }

            // ĐIỀN TỰ ĐỘNG & KIỂM SOÁT QUYỀN TRUY CẬP THEO ROLE
            const textInput = document.getElementById('textInput');
            if (textInput) {
                if (authRole === 'admin' || authId.toLowerCase() === 'admin') {
                    // ----------------------------------------------------
                    // QUYỀN ADMIN: Tự do nhập liệu, hiển thị đầy đủ tính năng
                    // ----------------------------------------------------
                    textInput.value = ""; 
                    textInput.disabled = false;
                    textInput.placeholder = "Nhập Mã sinh viên bất kỳ để tra cứu (VD: 2026115)...";
                    
                    // Admin có thể cần dùng chức năng tra cứu hàng loạt (tải file Excel lên).
                    // Đoạn div.tabs hiện tại đang bị ẩn bằng inline style "display: none;"
                    const tabsDiv = document.querySelector('.tabs');
                    if (tabsDiv) {
                        tabsDiv.style.display = 'block'; // Mở khóa các tùy chọn tải file Excel
                    }
                    
                } else {
                    // ----------------------------------------------------
                    // QUYỀN SINH VIÊN: Khóa mã SV chính chủ, tra cứu tự động
                    // ----------------------------------------------------
                    textInput.value = authId;
                    textInput.disabled = true;
                    textInput.style.backgroundColor = "#e2e8f0";
                    textInput.style.cursor = "not-allowed";
                    textInput.style.color = "#475569";
                    textInput.style.fontWeight = "bold";

                    // Tự động kích hoạt bấm tra cứu
                    setTimeout(() => {
                        executeSearch();
                    }, 100);
                }
            }
        });

        const API_BASE_URL = "https://edutech-backend.nghiadv.workers.dev";

        // DỊCH VÀ SẮP XẾP ĐÚNG THỨ TỰ YÊU CẦU CỦA FILE RESULT.XLSX
        const ORDERED_HEADERS = [
            { key: "student_id", label: "MSV" },
            { key: "source_file", label: "Nguồn (File)" }, 
            { key: "sheet_name", label: "Sheet" }, 
            { key: "tt", label: "TT" }, 
            { key: "student_name", label: "Họ và tên" },
            { key: "dob", label: "Ngày sinh" },
            { key: "class_name", label: "Lớp" },
            { key: "subject_id", label: "Mã học phần" },
            { key: "subject_name", label: "Tên học phần" },
            { key: "exam_date", label: "Ngày thi" },
            { key: "exam_shift", label: "Ca thi" },
            { key: "exam_code", label: "Đề số/ Mã đề" },
            { key: "score_process", label: "Quá trình" },
            { key: "score_test", label: "Kiểm tra" },
            { key: "score_project", label: "Đề án" },
            { key: "score_exam", label: "Thi" },
            { key: "score_assignment", label: "BTL" },
            { key: "score_bchc", label: "BCHC" },
            { key: "score_oral", label: "Vấn đáp" },
            { key: "score_final", label: "TB" },
            { key: "score_total", label: "Tổng kết" },
            { key: "note", label: "Ghi chú" }
        ];

	
        async function executeSearch() {
            const modeElement = document.querySelector('input[name="mode"]:checked');
            const mode = modeElement ? modeElement.value : 'database';

            const textElement = document.getElementById('textInput');
            const textVal = textElement ? textElement.value.trim() : '';

            const fileElement = document.getElementById('fileInput');
            const fileInput = fileElement ? fileElement.files[0] : null;

            const authRole = sessionStorage.getItem("secure_role") || 'student';

            const showUIError = (message) => {
                document.getElementById('resultArea').innerHTML = `
            <div style="color: #dc3545; font-weight: bold; padding: 15px; background: #f8d7da; border-radius: 5px; border: 1px solid #f5c6cb;">
                ⚠️ ${message}
            </div>`;
            };

            document.getElementById('resultArea').innerHTML = "⏳ Đang phân tích file và truy vấn dữ liệu (Vui lòng đợi)...";

            // =========================================================
            // XỬ LÝ CHẾ ĐỘ 1: TRA CỨU - TRÍCH XUẤT VĂN BẢN
            // =========================================================
            if (mode === 'rag') {
                if (fileInput && authRole === 'admin') {
                    // TÍNH NĂNG MỚI DÀNH CHO ADMIN: Lọc kết hợp Mã sinh viên & Mã môn từ file Excel
                    handleAdminRagFileUpload(fileInput, showUIError);
                } else {
                    // TÍNH NĂNG CŨ: Tra cứu text bình thường
                    if (!textVal) return showUIError("Vui lòng nhập từ khóa tìm kiếm văn bản.");
                    fetchRagSearch(textVal);
                }
            } 
            // =========================================================
            // XỬ LÝ CHẾ ĐỘ 2 & 3: TRA CỨU ĐIỂM / HỌC PHÍ (GIỮ NGUYÊN GỐC)
            // =========================================================
            else {
                let studentIds = [];

                if (fileInput) {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        const idKeywords = ['mã sv', 'msv', 'mã sinh viên', 'masv', 'student_id', 'sbd', 'mã hv', 'mã định danh', 'mã số', 'id'];
                        let targetColIdx = -1;
                        let startRowIdx = -1;

                        for (let i = 0; i < Math.min(rows.length, 20); i++) {
                            const row = rows[i];
                            if (!row) continue;
                            for (let j = 0; j < row.length; j++) {
                                const cellVal = String(row[j] || '').toLowerCase().trim();
                                if (idKeywords.some(kw => cellVal.includes(kw))) {
                                    targetColIdx = j;
                                    startRowIdx = i + 1;
                                    break;
                                }
                            }
                            if (targetColIdx !== -1) break;
                        }

                        if (targetColIdx !== -1) {
                            for (let i = startRowIdx; i < rows.length; i++) {
                                if (!rows[i]) continue;
                                let idVal = String(rows[i][targetColIdx] || '').trim();
                                if (idVal && idVal.toLowerCase() !== 'nan') {
                                    if (idVal.endsWith('.0')) idVal = idVal.slice(0, -2);
                                    studentIds.push(idVal);
                                }
                            }
                        } else {
                            for (let i = 0; i < rows.length; i++) {
                                if (!rows[i]) continue;
                                let idVal = String(rows[i][0] || '').trim();
                                if (idVal && idVal.toLowerCase() !== 'nan' && idVal.length >= 3) {
                                    if (idVal.endsWith('.0')) idVal = idVal.slice(0, -2);
                                    studentIds.push(idVal);
                                }
                            }
                        }

                        studentIds = [...new Set(studentIds)];

                        if (studentIds.length === 0) {
                            return showUIError("Không tìm thấy cột Mã định danh / Mã SV hợp lệ trong file tải lên!");
                        }

                        fetchDatabaseInfo(mode, studentIds, true);
                    };
                    reader.readAsArrayBuffer(fileInput);
                } else if (textVal) {
                    let cleanId = textVal.endsWith('.0') ? textVal.slice(0, -2) : textVal;
                    studentIds = [cleanId];
                    fetchDatabaseInfo(mode, studentIds, false);
                } else {
                    showUIError("Vui lòng nhập Mã SV để tra cứu.");
                }
            }
        }

// =========================================================================
        // CÁC HÀM XỬ LÝ MỚI CHO TÍNH NĂNG TRA CỨU MSV + MÃ MÔN CỦA ADMIN
        // =========================================================================
        
        // HÀM CHUẨN HÓA SIÊU MẠNH: Xóa mọi khoảng trắng, xóa đuôi .0, đưa về chữ thường
        const normalizeString = (str) => {
            if (str === null || str === undefined) return '';
            // Xóa tất cả khoảng trắng (cả ở giữa) và đưa về chữ thường
            let s = String(str).toLowerCase().replace(/\s+/g, ''); 
            if (s.endsWith('.0')) s = s.slice(0, -2);
            return s;
        };

        async function handleAdminRagFileUpload(file, showErrorFn) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    let pairs = [];
                    let studentIds = [];
                    
                    // Đọc 2 cột đầu tiên (Cột 0: MSV, Cột 1: Mã môn)
                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length < 2) continue;
                        
                        // Lấy giá trị thô ban đầu (Raw)
                        let rawMsv = String(row[0] || '').trim();
                        let rawMm = String(row[1] || '').trim();
                        
                        // Khử lỗi Excel tự chèn đuôi thập phân vào IDSV dạng số
                        if (rawMsv.endsWith('.0')) rawMsv = rawMsv.slice(0, -2);
                        
                        // Tạo phiên bản chuẩn hóa tuyệt đối để so khớp
                        let msvFilter = normalizeString(rawMsv);
                        let mmFilter = normalizeString(rawMm);
                        
                        // Bỏ qua dòng tiêu đề (Dự phòng nhiều cách ghi tiêu đề khác nhau)
                        if (!msvFilter || !mmFilter || msvFilter === 'idsv' || msvFilter.includes('mã') || msvFilter === 'msv' || msvFilter.includes('student')) continue;
                        
                        pairs.push({ msv: msvFilter, mm: mmFilter });
                        
                        // LƯU Ý QUAN TRỌNG: Đẩy rawMsv (giữ nguyên chữ hoa/thường) lên Server 
                        // để tránh lỗi CSDL từ chối do khác Case-sensitive
                        studentIds.push(rawMsv); 
                    }
                    
                    // Loại bỏ MSV trùng lặp để tối ưu query gửi lên Cloudflare
                    studentIds = [...new Set(studentIds)]; 
                    
                    if (studentIds.length === 0) {
                        return showErrorFn("Không tìm thấy dữ liệu IDSV và Mã môn hợp lệ trong file Excel!");
                    }
                    
                    document.getElementById('resultArea').innerHTML = `⏳ Đang kéo dữ liệu từ máy chủ cho ${studentIds.length} sinh viên...`;
                    
                    // Fetch dữ liệu từ API điểm
                    let allData = [];
                    const chunkSize = 50;
                    for (let i = 0; i < studentIds.length; i += chunkSize) {
                        const chunk = studentIds.slice(i, i + chunkSize);
                        const res = await fetch(API_BASE_URL + '/api/db/grades', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ student_ids: chunk })
                        });
                        const result = await res.json();
                        if (result.status === "success" && result.data) {
                            allData = allData.concat(result.data);
                        }
                    }
                    
                    // BƯỚC LỌC KÉP QUAN TRỌNG: Sử dụng hàm chuẩn hóa siêu mạnh cho cả 2 phía
                    const filteredData = allData.filter(row => {
                        const rMsv = normalizeString(row.student_id);
                        const rMm = normalizeString(row.subject_id);
                        return pairs.some(p => p.msv === rMsv && p.mm === rMm);
                    });
                    
                    // Chống trùng lặp hiển thị theo Hash
                    const uniqueData = [];
                    const seenHashes = new Set();
                    filteredData.forEach(row => {
                        const hashKey = row.record_hash || [
                            row.student_id, row.student_name, row.dob, row.class_name,
                            row.subject_id, row.subject_name, row.exam_date, row.exam_shift, row.exam_code,
                            row.score_process, row.score_test, row.score_project, row.score_exam,
                            row.score_assignment, row.score_bchc, row.score_oral, row.score_final, row.score_total, row.note
                        ].map(v => normalizeString(v)).join('|');

                        if (!seenHashes.has(hashKey)) {
                            seenHashes.add(hashKey);
                            uniqueData.push(row);
                        }
                    });
                    
                    // Gắn vào biến toàn cục để phân trang và xuất Excel
                    window.adminRagData = uniqueData;
                    window.adminRagCurrentPage = 1;
                    
                    renderAdminRagTable(); // Hàm hiển thị bảng và phân trang (giữ nguyên không đổi)
                    
                } catch (err) {
                    showErrorFn("Lỗi xử lý file Excel: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderAdminRagTable() {
            const data = window.adminRagData || [];
            if (data.length === 0) {
                document.getElementById('resultArea').innerHTML = `
                <div style="color: #856404; font-weight: bold; padding: 15px; background: #fff3cd; border-radius: 5px; border: 1px solid #ffeeba;">
                    📭 Không tìm thấy kết quả nào khớp với các cặp Mã SV & Mã Môn trong file.
                </div>`;
                return;
            }
            
            // Xử lý logic phân trang (10 records/trang)
            const pageSize = 10;
            const totalPages = Math.ceil(data.length / pageSize);
            const currentPage = window.adminRagCurrentPage;
            const startIdx = (currentPage - 1) * pageSize;
            const pageData = data.slice(startIdx, startIdx + pageSize);
            
            let html = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h4 style="margin: 0; color: #007bff;">📋 Kết quả tra cứu (Tổng: ${data.length} bản ghi)</h4>
                <button class="btn-download" onclick="exportAdminRagExcel()" style="margin: 0;">📥 Xuất File Result (.xlsx)</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead><tr>`;
            
            ORDERED_HEADERS.forEach(col => html += `<th>${col.label}</th>`);
            html += `</tr></thead><tbody>`;
            
            pageData.forEach(row => {
                html += '<tr>';
                ORDERED_HEADERS.forEach(col => {
                    let val = row[col.key];
                    if (val === null || val === undefined || val === '') val = '';
                    if (col.key === 'subject_name') {
                        html += `<td style="text-align: left;">${val}</td>`;
                    } else {
                        html += `<td>${val}</td>`;
                    }
                });
                html += '</tr>';
            });
            
            html += `</tbody></table></div>`;
            
            // Tạo thanh điều hướng trang (Pagination Controls)
            html += `
            <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 25px;">
                <button onclick="changeAdminRagPage(-1)" class="search-btn" style="padding: 10px 20px; ${currentPage === 1 ? 'opacity: 0.4; cursor: not-allowed;' : ''}" ${currentPage === 1 ? 'disabled' : ''}>⬅ Trang trước</button>
                <span style="font-weight: bold; font-size: 1.1em; color: #333;">Trang ${currentPage} / ${totalPages}</span>
                <button onclick="changeAdminRagPage(1)" class="search-btn" style="padding: 10px 20px; ${currentPage === totalPages ? 'opacity: 0.4; cursor: not-allowed;' : ''}" ${currentPage === totalPages ? 'disabled' : ''}>Trang sau ➡</button>
            </div>
            `;
            
            document.getElementById('resultArea').innerHTML = html;
        }

        function changeAdminRagPage(delta) {
            const pageSize = 10;
            const totalPages = Math.ceil((window.adminRagData || []).length / pageSize);
            let newPage = window.adminRagCurrentPage + delta;
            
            if (newPage < 1) newPage = 1;
            if (newPage > totalPages) newPage = totalPages;
            
            window.adminRagCurrentPage = newPage;
            renderAdminRagTable();
        }

        function exportAdminRagExcel() {
            if (!window.adminRagData || window.adminRagData.length === 0) return;
            
            const exportData = window.adminRagData.map(row => {
                let newRow = {};
                ORDERED_HEADERS.forEach(col => {
                    newRow[col.label] = row[col.key] !== null ? row[col.key] : "";
                });
                return newRow;
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Kết quả");
            XLSX.writeFile(workbook, "Ket_qua_tra_cuu_Msv_Mamon.xlsx");
        }
        
        async function fetchDatabaseInfo(mode, ids, isBatch) {
            const endpoint = mode === 'grades' ? '/api/db/grades' : '/api/db/tuition';

            try {
                let allData = [];
                const chunkSize = 50;

                for (let i = 0; i < ids.length; i += chunkSize) {
                    const chunk = ids.slice(i, i + chunkSize);
                    const res = await fetch(API_BASE_URL + endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ student_ids: chunk })
                    });

                    const result = await res.json();

                    if (result.status === "success" && result.data) {
                        allData = allData.concat(result.data);
                    } else if (result.status === "error") {
                        throw new Error(result.message);
                    }
                }

                // Chuyển toàn bộ thông số sang hàm vẽ bảng
                renderTable(allData, isBatch, ids);
            } catch (e) {
                console.error(e);
                document.getElementById('resultArea').innerHTML = `❌ Lỗi truy xuất máy chủ CSDL: ${e.message || 'Không thể kết nối'}`;
            }
        }

        // (Giữ nguyên các hàm RAG Search cũ)
        async function fetchRagSearch(query) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/rag/search?query=${encodeURIComponent(query)}`);
                const { data } = await res.json();

                if (!data || data.length === 0) {
                    document.getElementById('resultArea').innerHTML = "Không tìm thấy văn bản phù hợp.";
                    return;
                }

                let html = "<ul>";
                data.forEach(item => {
                    html += `<li style="margin-bottom: 10px;">
                            <a href="${item.metadata?.url}" target="_blank" style="text-decoration: none; color: #007bff; font-weight: bold;">📄 ${item.metadata?.filename || 'Tài liệu liên quan'}</a> 
                            <button style="margin-left: 10px; padding: 5px 10px; font-size: 12px;" onclick="extractInvoice('${encodeURIComponent(item.metadata?.text || '')}')">Trích xuất Buyer (Invoice)</button>
                         </li>`;
                });
                document.getElementById('resultArea').innerHTML = html + "</ul>";
            } catch (e) {
                document.getElementById('resultArea').innerHTML = "❌ Lỗi tìm kiếm AI Vector.";
            }
        }

        async function extractInvoice(encodedText) {
            document.getElementById('resultArea').innerHTML = "🤖 AI đang phân tích tài liệu...";
            try {
                const res = await fetch(API_BASE_URL + '/api/rag/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: decodeURIComponent(encodedText) })
                });
                const { encoded_data } = await res.json();
                const json = JSON.parse(decodeURIComponent(escape(atob(encoded_data))));
                document.getElementById('resultArea').innerHTML = `
                <div style="background: #e9ecef; padding: 15px; border-radius: 5px;">
                    <p><strong>Mã số thuế:</strong> ${json.buyer_tax_id}</p>
                    <p><strong>Địa chỉ:</strong> ${json.buyer_address}</p>
                </div>`;
            } catch (e) {
                document.getElementById('resultArea').innerHTML = "❌ Trích xuất AI thất bại. Văn bản không đúng định dạng Hóa đơn.";
            }
        }

        function renderTable(dataArray, isBatch, requestedIds) {
            // =================================================================
            // MÀNG LỌC TRÙNG LẶP THEO MÃ HASH TẠI FRONT-END
            // =================================================================
            if (dataArray && dataArray.length > 0) {
                const uniqueData = [];
                const seenHashes = new Set();

                dataArray.forEach(row => {
                    // Ưu tiên lấy record_hash từ CSDL trả về. 
                    // Nếu là dữ liệu cũ chưa có cột record_hash, tự động ghép 18 trường cốt lõi để tạo khóa băm ảo
                    const hashKey = row.record_hash || [
                        row.student_id, row.student_name, row.dob, row.class_name,
                        row.subject_id, row.subject_name, row.exam_date, row.exam_shift, row.exam_code,
                        row.score_process, row.score_test, row.score_project, row.score_exam,
                        row.score_assignment, row.score_bchc, row.score_oral, row.score_final, row.score_total, row.note
                    ].map(v => (v === null || v === undefined) ? "" : String(v).trim().toLowerCase()).join('|');

                    // CHỈ LẤY VÀ HIỂN THỊ CÁC DÒNG CÓ MÃ HASH KHÁC NHAU (DUY NHẤT)
                    if (!seenHashes.has(hashKey)) {
                        seenHashes.add(hashKey); // Đánh dấu đã thấy mã này
                        uniqueData.push(row);    // Đưa vào danh sách hiển thị
                    }
                });

                // Ghi đè lại mảng dữ liệu gốc bằng mảng dữ liệu đã được gọt sạch
                dataArray = uniqueData;
            }
            // =================================================================

            // Lưu dữ liệu vào biến toàn cục để phục vụ phân trang và xuất Excel
            window.regularSearchData = dataArray;
            window.currentData = dataArray; // Giữ nguyên biến này cho hàm downloadExcel cũ
            window.regularSearchCurrentPage = 1;
            window.regularSearchIsBatch = isBatch;
            window.regularSearchIds = requestedIds;

            // Chuyển sang hàm vẽ HTML có phân trang
            renderRegularTablePage();
        }

        function renderRegularTablePage() {
            const dataArray = window.regularSearchData || [];
            const isBatch = window.regularSearchIsBatch;
            const requestedIds = window.regularSearchIds;

            // Xử lý hiển thị trực tiếp lên UI khi KHÔNG CÓ DỮ LIỆU hợp lệ
            if (!dataArray || dataArray.length === 0) {
                if (!isBatch) {
                    const singleId = requestedIds && requestedIds.length > 0 ? requestedIds[0] : '';
                    document.getElementById('resultArea').innerHTML = `
                    <div style="color: #856404; font-weight: bold; padding: 15px; background: #fff3cd; border-radius: 5px; border: 1px solid #ffeeba;">
                        📭 Hệ thống không tìm thấy dữ liệu điểm cho mã định danh: <span style="font-size: 1.2em;">${singleId}</span>
                    </div>`;
                } else {
                    document.getElementById('resultArea').innerHTML = `
                    <div style="color: #856404; font-weight: bold; padding: 15px; background: #fff3cd; border-radius: 5px; border: 1px solid #ffeeba;">
                        📭 Không tìm thấy bất kỳ dữ liệu nào trùng khớp từ danh sách tải lên.
                    </div>`;
                }
                return;
            }

            // Logic phân trang (10 records/trang)
            const pageSize = 10;
            const totalPages = Math.ceil(dataArray.length / pageSize);
            const currentPage = window.regularSearchCurrentPage;
            const startIdx = (currentPage - 1) * pageSize;
            const pageData = dataArray.slice(startIdx, startIdx + pageSize);

            // Nếu có dữ liệu thì vẽ bảng
            let html = `
            <!-- <button class="btn-download" onclick="downloadExcel()">📥 Tải File Result (Excel)</button> -->
            <div class="table-responsive">
            <table>
                <thead><tr>
            `;

            ORDERED_HEADERS.forEach(col => html += `<th>${col.label}</th>`);
            html += '</tr></thead><tbody>';

            pageData.forEach(row => {
                html += '<tr>';
                ORDERED_HEADERS.forEach(col => {
                    let val = row[col.key];
                    if (val === null || val === undefined || val === '') val = '';
                    
                    // Xử lý canh trái riêng cho cột Tên học phần
                    if (col.key === 'subject_name') {
                        html += `<td style="text-align: left;">${val}</td>`;
                    } else {
                        html += `<td>${val}</td>`; 
                    }
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';

            // Thêm thanh điều hướng trang (Pagination Controls)
            html += `
            <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 25px;">
                <button onclick="changeRegularPage(-1)" class="search-btn" style="padding: 10px 20px; ${currentPage === 1 ? 'opacity: 0.4; cursor: not-allowed;' : ''}" ${currentPage === 1 ? 'disabled' : ''}>⬅ Trang trước</button>
                <span style="font-weight: bold; font-size: 1.1em; color: #333;">Trang ${currentPage} / ${totalPages}</span>
                <button onclick="changeRegularPage(1)" class="search-btn" style="padding: 10px 20px; ${currentPage === totalPages ? 'opacity: 0.4; cursor: not-allowed;' : ''}" ${currentPage === totalPages ? 'disabled' : ''}>Trang sau ➡</button>
            </div>
            `;

            document.getElementById('resultArea').innerHTML = html;
        }

        function changeRegularPage(delta) {
            const dataArray = window.regularSearchData || [];
            const pageSize = 10;
            const totalPages = Math.ceil(dataArray.length / pageSize);
            let newPage = window.regularSearchCurrentPage + delta;
            
            if (newPage < 1) newPage = 1;
            if (newPage > totalPages) newPage = totalPages;
            
            window.regularSearchCurrentPage = newPage;
            
            // Gọi lại hàm vẽ HTML để cập nhật dữ liệu của trang mới
            renderRegularTablePage();
        }

        function downloadExcel() {
            if (!window.currentData) return;

            const exportData = window.currentData.map(row => {
                let newRow = {};
                ORDERED_HEADERS.forEach(col => {
                    newRow[col.label] = row[col.key] !== null ? row[col.key] : "";
                });
                return newRow;
            });

            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Sheet1");
            XLSX.writeFile(workbook, "result.xlsx");
        }
    </script>
